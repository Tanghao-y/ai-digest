<html lang="zh-CN"><head><meta charset="utf-8">

<title>AI 产品动态</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22%230a84ff%22%2F%3E%3Cpath%20d%3D%22M17%2021h30M17%2032h30M17%2043h19%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<meta property="og:title" content="AI 产品动态">
<style>
  :root { --bg: #f2f2f7; --card: #fff; --ink: #1c1c1e; --ink2: #3a3a3c; --mute: #8e8e93; --line: rgba(60,60,67,.14);
          --chip: #eef0f4; --accent: #0a84ff; --on-accent: #fff; --bar: rgba(242,242,247,.86); --am: #e07b00; --pm: #5856d6;
          --am-solid: #e07b00; --pm-solid: #5856d6; }
  @media (prefers-color-scheme: dark) { :root {
          --bg: #000; --card: #1c1c1e; --ink: #f2f2f7; --ink2: #d1d1d6; --line: rgba(235,235,245,.16);
          --chip: #2c2c2e; --bar: rgba(0,0,0,.8); --am: #ff9f0a; --pm: #8e8cff; } }
  .am { --ed: var(--am); --ed-solid: var(--am-solid); } .pm { --ed: var(--pm); --ed-solid: var(--pm-solid); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  a { color: inherit; text-decoration: none; }
  [hidden] { display: none !important; }
  .col { max-width: 640px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
  header { padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: 16px; }
  .bar { display: flex; align-items: center; gap: 8px; min-height: 36px; margin-bottom: 18px; }
  .back { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px 0 11px; border-radius: 99px;
          background: var(--card); color: var(--ink); font-size: 15px; font-weight: 600; }
  h1 { margin: 0; font-size: 34px; line-height: 1.2; letter-spacing: -.02em; }
  .search { display: none; padding-bottom: 14px; }
  .js .search { display: block; }
  .search input { width: 100%; height: 42px; padding: 0 16px; border: 0; border-radius: 14px; background: var(--card);
                  color: var(--ink); font: inherit; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none; }
  .search input:focus { box-shadow: 0 0 0 2px var(--accent); }
  .tag { display: inline-block; padding: 0 8px; border-radius: 99px; color: var(--ed); font-weight: 700; letter-spacing: 0;
         background: var(--chip); background: color-mix(in srgb, var(--ed) 15%, transparent); }
  .kicker { font-size: 12px; font-weight: 600; color: var(--mute); letter-spacing: .04em; }
  .chip { display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%; height: 30px; padding: 0 12px; border: 0;
          border-radius: 99px; background: var(--chip); color: var(--accent); font: inherit; font-size: 13px; font-weight: 500;
          cursor: pointer; }
  .host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { display: none; padding: 48px 0; text-align: center; color: var(--mute); }
  .empty.on { display: block; }
  footer { padding-top: 6px; padding-bottom: max(36px, env(safe-area-inset-bottom)); font-size: 12px; color: var(--mute); line-height: 1.7; }
  header { padding-top: max(30px, env(safe-area-inset-top)); }
  main { padding-bottom: max(40px, env(safe-area-inset-bottom)); }
  /* a day: "今天", "昨天" are written in by script, the date then steps back */
  .day { margin: 40px 2px 14px; font-size: 20px; line-height: 1.3; letter-spacing: -.01em; }
  #list > .day:first-child { margin-top: 10px; }
  .day b { margin-right: .5em; }
  .day.rel span { font-size: 15px; font-weight: 600; color: var(--mute); letter-spacing: 0; }
  .badge { padding: 0 8px; border-radius: 99px; background: var(--ed-solid); color: #fff; font-weight: 700; letter-spacing: 0; text-shadow: none; }
  /* the newest edition */
  .lead { display: block; border-radius: 24px; background: var(--card); overflow: hidden; }
  .lead .pic { position: relative; display: block; aspect-ratio: 16 / 10; background: linear-gradient(160deg, #3a6ff0, #1c1c1e 85%); }
  .lead img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .lead .tx { position: absolute; left: 0; right: 0; bottom: 0; padding: 104px 18px 16px; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.79) 8.1%, rgba(0,0,0,0.761) 15.5%, rgba(0,0,0,0.717) 22.5%, rgba(0,0,0,0.66) 29%, rgba(0,0,0,0.593) 35.3%, rgba(0,0,0,0.518) 41.2%, rgba(0,0,0,0.44) 47.1%, rgba(0,0,0,0.36) 52.9%, rgba(0,0,0,0.282) 58.8%, rgba(0,0,0,0.207) 64.7%, rgba(0,0,0,0.14) 71%, rgba(0,0,0,0.083) 77.5%, rgba(0,0,0,0.039) 84.5%, rgba(0,0,0,0.01) 91.9%, rgba(0,0,0,0) 100%); color: #fff;
              text-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .lead .kicker { color: rgba(255,255,255,.78); }
  .lead .t { margin-top: 6px; font-size: 22px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em; }
  .lead ul { margin: 0; padding: 6px 18px 0; list-style: none; }
  .lead li { padding: 10px 0; font-size: 15px; line-height: 1.45; color: var(--ink2); }
  .lead li + li { border-top: .5px solid var(--line); }
  .lead ul { padding-bottom: 8px; }
  /* the same day's other edition */
  .also { display: flex; gap: 14px; align-items: center; margin-top: 12px; padding: 14px 14px 14px 18px; border-radius: 24px; background: var(--card); }
  .also .txt { flex: 1; min-width: 0; }
  .also img { flex: none; width: 92px; height: 62px; border-radius: 13px; object-fit: cover; background: var(--chip); }
  .kicker { display: flex; align-items: center; gap: 8px; }
  .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; line-height: 1.4; }
  .also .t { margin-top: 5px; font-size: 16px; }
  /* earlier days: morning and evening side by side */
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { display: block; border-radius: 24px; background: var(--card); overflow: hidden; }
  .tile .pic { position: relative; display: block; aspect-ratio: 3 / 2; background: linear-gradient(160deg, #3a6ff0, #1c1c1e 85%); }
  .tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tile .tx { display: block; padding: 11px 14px 14px; }
  .tile .t { margin-top: 5px; font-size: 14px; }
  .tile.solo { grid-column: 1 / -1; }
  .tile.solo .pic { aspect-ratio: 5 / 2; }
  .tile.solo .t { font-size: 16px; }
  /* search results */
  #hits { padding-top: 4px; }
  .hit { margin: 0 0 16px; padding: 16px 18px 18px; border-radius: 24px; background: var(--card); }
  .hit h4 { margin: 4px 0 6px; font-size: 18px; line-height: 1.4; }
  .hit p { margin: 0 0 12px; font-size: 13px; line-height: 1.6; color: var(--ink2); overflow-wrap: anywhere; }

  @supports (corner-shape: squircle) {
    .lead, .also, .tile, .hit { corner-shape: squircle; border-radius: 41px; }
    .also img { corner-shape: squircle; border-radius: 22px; }
  }
  @supports not (corner-shape: squircle) {
    .lead, .also, .tile, .hit { border-radius: 0; clip-path: polygon(0px 40.8px, 0.31px 23.8px, 1.25px 16.94px, 2.83px 11.95px, 5.09px 8.09px, 8.09px 5.09px, 11.95px 2.83px, 16.94px 1.25px, 23.8px 0.31px, 40.8px 0px, calc(100% - 40.8px) 0px, calc(100% - 23.8px) 0.31px, calc(100% - 16.94px) 1.25px, calc(100% - 11.95px) 2.83px, calc(100% - 8.09px) 5.09px, calc(100% - 5.09px) 8.09px, calc(100% - 2.83px) 11.95px, calc(100% - 1.25px) 16.94px, calc(100% - 0.31px) 23.8px, 100% 40.8px, 100% calc(100% - 40.8px), calc(100% - 0.31px) calc(100% - 23.8px), calc(100% - 1.25px) calc(100% - 16.94px), calc(100% - 2.83px) calc(100% - 11.95px), calc(100% - 5.09px) calc(100% - 8.09px), calc(100% - 8.09px) calc(100% - 5.09px), calc(100% - 11.95px) calc(100% - 2.83px), calc(100% - 16.94px) calc(100% - 1.25px), calc(100% - 23.8px) calc(100% - 0.31px), calc(100% - 40.8px) 100%, 40.8px 100%, 23.8px calc(100% - 0.31px), 16.94px calc(100% - 1.25px), 11.95px calc(100% - 2.83px), 8.09px calc(100% - 5.09px), 5.09px calc(100% - 8.09px), 2.83px calc(100% - 11.95px), 1.25px calc(100% - 16.94px), 0.31px calc(100% - 23.8px), 0px calc(100% - 40.8px)); }
    .also img { border-radius: 0; clip-path: polygon(0px 22.1px, 0.17px 12.89px, 0.68px 9.18px, 1.53px 6.47px, 2.76px 4.38px, 4.38px 2.76px, 6.47px 1.53px, 9.18px 0.68px, 12.89px 0.17px, 22.1px 0px, calc(100% - 22.1px) 0px, calc(100% - 12.89px) 0.17px, calc(100% - 9.18px) 0.68px, calc(100% - 6.47px) 1.53px, calc(100% - 4.38px) 2.76px, calc(100% - 2.76px) 4.38px, calc(100% - 1.53px) 6.47px, calc(100% - 0.68px) 9.18px, calc(100% - 0.17px) 12.89px, 100% 22.1px, 100% calc(100% - 22.1px), calc(100% - 0.17px) calc(100% - 12.89px), calc(100% - 0.68px) calc(100% - 9.18px), calc(100% - 1.53px) calc(100% - 6.47px), calc(100% - 2.76px) calc(100% - 4.38px), calc(100% - 4.38px) calc(100% - 2.76px), calc(100% - 6.47px) calc(100% - 1.53px), calc(100% - 9.18px) calc(100% - 0.68px), calc(100% - 12.89px) calc(100% - 0.17px), calc(100% - 22.1px) 100%, 22.1px 100%, 12.89px calc(100% - 0.17px), 9.18px calc(100% - 0.68px), 6.47px calc(100% - 1.53px), 4.38px calc(100% - 2.76px), 2.76px calc(100% - 4.38px), 1.53px calc(100% - 6.47px), 0.68px calc(100% - 9.18px), 0.17px calc(100% - 12.89px), 0px calc(100% - 22.1px)); }
  }
</style>
<script>document.documentElement.classList.add('js');
  try { localStorage.removeItem('digest-theme'); } catch (e) {}   // left by the old manual theme switch</script>
</head><body>
<header class="col">
  <h1>AI 产品动态</h1>
</header>
<div class="search col">
  <input id="q" type="search" placeholder="搜索" autocomplete="off" autocapitalize="off" spellcheck="false">
</div>
<main class="col">
  <div id="list">
    <h2 class="day" data-date="2026-11-14"><span>11月14日 周六</span></h2>
    <a class="lead pm" href="2026-11-14-pm/">
      <span class="pic"><img src="2026-11-14-pm/13.jpg" alt="">
        <span class="tx"><span class="kicker"><span class="badge">晚报</span>13 条 · 19:34 更新</span><span class="t">Anthropic · 官宣启动 IPO</span></span></span>
      <ul><li>Anthropic · Claude Meetings beta 上线</li><li>Anthropic · Claude Duet 邀请全部美国等待名单用户</li><li>Anthropic · Claude Code Projects 支持并行 worker</li></ul>
    </a>
    <a class="also am" href="2026-11-14-am/">
      <span class="txt"><span class="kicker"><span class="tag">早报</span>9 条</span>
        <span class="t">NVIDIA · 黄仁勋辞任 CEO</span></span>
      <img src="2026-11-14-am/07.jpg" alt="" loading="lazy">
    </a></div>
  <div id="hits" hidden></div>
  <div class="empty" id="empty">没有匹配的条目</div>
</main>
<script>
(function () {
  // 今天 / 昨天 / 前天 in front of the dates they apply to.
  var today = new Date(); today.setHours(0, 0, 0, 0);
  [].forEach.call(document.querySelectorAll('.day[data-date]'), function (h) {
    var d = h.getAttribute('data-date').split('-'), ago = Math.round((today - new Date(d[0], d[1] - 1, d[2])) / 864e5);
    var word = ['今天', '昨天', '前天'][ago];
    if (!word) return;
    var b = document.createElement('b'); b.textContent = word;
    h.insertBefore(b, h.firstChild); h.classList.add('rel');
  });

  var q = document.getElementById('q'), list = document.getElementById('list'),
      hits = document.getElementById('hits'), empty = document.getElementById('empty'), data = null, loading = null;
  function load() {
    return loading || (loading = fetch('editions.json').then(function (r) { return r.json(); })
      .then(function (d) { data = d; }, function () { loading = null; }));
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n;
  }
  function host(u) { try { return new URL(u).hostname.replace(/^www[.]/, ''); } catch (e) { return u; } }
  function apply() {
    var term = q.value.trim().toLowerCase();
    list.hidden = !!term; hits.hidden = !term; hits.textContent = ''; empty.classList.remove('on');
    if (!term) return;
    if (!data) { load().then(function () { if (data) apply(); }); return; }
    var shown = 0;
    data.forEach(function (e) {
      (e.items || []).forEach(function (it) {
        if (shown >= 60 || [it.t, it.s, it.u, it.c].join(' ').toLowerCase().indexOf(term) < 0) return;
        shown++;
        var card = el('article', 'hit ' + (e.edition === '早报' ? 'am' : 'pm')), k = el('a', 'kicker');
        k.href = e.id + '/';
        k.appendChild(el('span', 'tag', e.edition));
        k.appendChild(el('span', null, Number(e.date.slice(5, 7)) + '月' + Number(e.date.slice(8)) + '日' + (it.c ? ' · ' + it.c : '')));
        card.appendChild(k);
        card.appendChild(el('h4', null, it.t));
        if (it.s) card.appendChild(el('p', null, it.s));
        if (/^https?:/i.test(it.u || '')) {
          var c = el('a', 'chip'); c.href = it.u; c.target = '_blank'; c.rel = 'noopener';
          c.appendChild(el('span', 'host', host(it.u))); c.appendChild(el('span', null, '↗')); card.appendChild(c);
        }
        hits.appendChild(card);
      });
    });
    empty.classList.toggle('on', shown === 0);
  }
  q.addEventListener('focus', load);
  q.addEventListener('input', apply);
  try { var asked = new URLSearchParams(location.search).get('q'); if (asked) { q.value = asked; apply(); } } catch (e) {}
})();
</script>
</body></html>
