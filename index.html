<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>AI 产品动态</title>
<meta property="og:title" content="AI 产品动态">
<style>
  :root { --bg: #f2f2f7; --card: #fff; --ink: #1c1c1e; --ink2: #3a3a3c; --mute: #8e8e93; --chip: #eef0f4; --accent: #0a84ff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
          --bg: #000; --card: #1c1c1e; --ink: #f2f2f7; --ink2: #d1d1d6; --chip: #2c2c2e; } }
  :root[data-theme="dark"] { --bg: #000; --card: #1c1c1e; --ink: #f2f2f7; --ink2: #d1d1d6; --chip: #2c2c2e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .col { max-width: 640px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
  header { padding-top: max(28px, env(safe-area-inset-top)); padding-bottom: 6px; }
  h1 { margin: 0; font-size: 32px; line-height: 1.2; letter-spacing: -.01em; }
  .tools { display: none; }
  .js .tools { display: block; padding-top: 10px; }
  .tools input { width: 100%; height: 38px; padding: 0 14px; border: 0; border-radius: 11px; background: var(--card);
                 color: var(--ink); font: inherit; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none; }
  .tools input:focus { box-shadow: 0 0 0 2px var(--accent); }
  main { padding-bottom: max(32px, env(safe-area-inset-bottom)); }
  h2 { margin: 22px 2px 10px; font-size: 13px; font-weight: 700; color: var(--mute); letter-spacing: .04em; }
  .ed { display: flex; gap: 14px; align-items: center; margin: 0 0 10px; padding: 12px 12px 12px 16px; border-radius: 16px;
        background: var(--card); color: inherit; text-decoration: none; }
  .txt { flex: 1; min-width: 0; }
  .ed img { flex: none; width: 96px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--chip); }
  .kicker { font-size: 12px; font-weight: 600; color: var(--mute); letter-spacing: .04em; }
  .kicker a { color: inherit; text-decoration: none; }
  .pill { display: inline-block; margin-right: 8px; padding: 0 8px; border-radius: 99px; background: var(--accent); color: #fff;
          letter-spacing: 0; }
  h3 { margin: 4px 0 0; font-size: 17px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2;
       -webkit-box-orient: vertical; overflow: hidden; }
  #hits { padding-top: 18px; }
  .hit { margin: 0 0 10px; padding: 14px 16px 15px; border-radius: 16px; background: var(--card); }
  .hit h3 { margin: 3px 0 6px; display: block; }
  .hit p { margin: 0 0 12px; color: var(--ink2); overflow-wrap: anywhere; }
  .chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; height: 30px; padding: 0 12px; border-radius: 99px;
          background: var(--chip); color: var(--accent); font-size: 13px; font-weight: 500; text-decoration: none; }
  .host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { display: none; padding: 48px 0; text-align: center; color: var(--mute); }
  .empty.on { display: block; }
  [hidden] { display: none !important; }
</style></head><body>
<header class="col"><h1>AI 产品动态</h1></header>
<div class="tools col">
  <input id="q" type="search" placeholder="搜索全部往期" autocomplete="off" autocapitalize="off" spellcheck="false">
</div>
<main class="col">
  <div id="list">
    <h2>11月14日 周六</h2>
    
    <a class="ed" href="2026-11-14-pm/">
      <div class="txt">
        <div class="kicker"><span class="pill">晚报</span>8 条</div>
        <h3>Cloudflare · 开源AI智能体浏览器 Kitesurf</h3>
      </div>
      <img src="2026-11-14-pm/01.jpg" alt="" loading="lazy">
    </a>
    <a class="ed" href="2026-11-14-am/">
      <div class="txt">
        <div class="kicker"><span class="pill">早报</span>9 条</div>
        <h3>Google · Antigravity /teamwork 多智能体协作</h3>
      </div>
      <img src="2026-11-14-am/01.jpg" alt="" loading="lazy">
    </a></div>
  <div id="hits" hidden></div>
  <div class="empty" id="empty">没有匹配的条目</div>
</main>
<script>
(function () {
  var root = document.documentElement; root.classList.add('js');
  try { var saved = localStorage.getItem('digest-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  var q = document.getElementById('q'), list = document.getElementById('list'),
      hits = document.getElementById('hits'), empty = document.getElementById('empty'), data = null, loading = null;
  function load() {
    return loading || (loading = fetch('editions.json').then(function (r) { return r.json(); })
      .then(function (d) { data = d; }, function () { loading = null; }));
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n;
  }
  function host(u) { try { return new URL(u).hostname.replace(/^www[.]/, ''); } catch (e) { return u; } }
  function apply() {
    var term = q.value.trim().toLowerCase();
    list.hidden = !!term; hits.hidden = !term; hits.textContent = ''; empty.classList.remove('on');
    if (!term) return;
    if (!data) { load().then(function () { if (data) apply(); }); return; }
    var shown = 0;
    data.forEach(function (e) {
      (e.items || []).forEach(function (it) {
        if (shown >= 60 || [it.t, it.s, it.u, it.c].join(' ').toLowerCase().indexOf(term) < 0) return;
        shown++;
        var card = el('article', 'hit'), k = el('div', 'kicker'), a = el('a', null,
          Number(e.date.slice(5, 7)) + '月' + Number(e.date.slice(8)) + '日' + e.edition + (it.c ? ' · ' + it.c : ''));
        a.href = e.id + '/'; k.appendChild(a); card.appendChild(k);
        card.appendChild(el('h3', null, it.t));
        if (it.s) card.appendChild(el('p', null, it.s));
        if (/^https?:/i.test(it.u || '')) {
          var c = el('a', 'chip'); c.href = it.u; c.target = '_blank'; c.rel = 'noopener';
          c.appendChild(el('span', 'host', host(it.u))); c.appendChild(el('span', null, '↗')); card.appendChild(c);
        }
        hits.appendChild(card);
      });
    });
    empty.classList.toggle('on', shown === 0);
  }
  q.addEventListener('focus', load);
  q.addEventListener('input', apply);
})();
</script>
</body></html>
